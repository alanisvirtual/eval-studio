<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eval studio.</title><style>
*{box-sizing:border-box}body{margin:0;background:#121519;color:#e5e9ef;font:13px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:24px}h1,h2,p{margin:0}h1{font-size:34px;font-weight:350;letter-spacing:-1.6px}h2{font-size:17px;font-weight:550}small,.muted{color:#969fab}button,input,select,textarea{font:inherit;color:inherit;background:#22272e;border:1px solid #353c46;border-radius:5px;padding:6px 9px;min-width:0}button{cursor:pointer}button:hover{border-color:#adc9f3}button:disabled{opacity:.35;cursor:default}input[type=checkbox]{accent-color:#adc9f3}section,.metric{background:#1b1f25;border:1px solid #303640;border-radius:9px;padding:18px;margin-top:12px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.label{font-size:10px;letter-spacing:.65px;color:#aab4c1;font-weight:600}.blue{color:#adc9f3}.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:15px 0}label.field{display:grid;gap:5px;color:#aab4c1}.wide{grid-column:span 2}.fields input,.fields select{width:100%;height:31px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:10px}.track{height:3px;background:#303640;margin-top:8px}.track i{display:block;height:100%;background:#adc9f3}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-top:18px}.tabs button{font-size:11px;border-radius:6px 6px 0 0;padding:9px 12px}.tabs .selected{background:#adc9f3;color:#182d4c}.workspace{margin-top:0;padding-top:24px;outline:none}.controls,.summarygrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.control{background:#15191e;border:1px solid #303640;border-radius:6px;padding:12px}.control p{margin:8px 0 0 6px;color:#adc9f3;font-size:11px}.target{transition:background .75s}.target.saved{background:#28734f;transition:none}.runs{display:grid;gap:20px}.runs.dual{grid-template-columns:1fr 1fr}.run{padding:10px 0;border-bottom:1px solid #ffffff0c}.runline{display:flex;align-items:center;gap:9px}.num .control .keyline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-weight:400;line-height:1.7}.keyline span{white-space:nowrap}.keyline kbd{font:inherit;color:inherit;border:1px solid #465366;border-radius:4px;padding:2px 5px;background:#202833}.keydot{color:#adc9f3}.control #targettext{line-height:1.7;font-weight:400}

</style></head><body><main><header class="row between"><div><h1>eval studio<span class="blue">.</span></h1><div class="label blue">UNOFFICIAL TOOL FOR MEMO LAB</div></div><div><div class="row"><button id="demo" class="active">⚄ Generate demo</button><button id="export">↓ Export CSV</button><button id="reset">Reset</button></div><small>Last updated · Nov 26, 2026</small></div></header><section><div class="row between"><h2>Experiment Setup</h2><label class="label blue"><input id="multi" type="checkbox"> MULTI ITEM MODE</label></div><div class="fields"><label class="field wide">Task name<input id="task" value="Grocery Packing"></label><label class="field">Robot<input id="robot" value="2B-5"></label><label class="field">Cell<select id="cell"><option>Cell 1</option><option>Cell 2</option><option>Cell 3</option></select></label><label class="field">Items per run<input id="items" type="number" min="1" max="8" value="1"></label><label class="field">Phases per item<input id="phases" type="number" min="1" max="12" value="4"></label><label class="field">Configs<input id="configs" type="number" min="1" max="6" value="3"></label><label class="field">Runs / config<input id="runs" type="number" min="1" max="30" value="10"></label></div><div class="row"><span class="label">DISTRIBUTION</span><span id="levels"></span><small id="count"></small></div></section><div class="metrics" id="metrics"></div><div class="tabs" id="tabs"></div><section class="workspace" id="workspace" tabindex="0"><div class="row between"><h2 id="sheet"></h2><small id="sheetstatus"></small></div><div class="controls"><div class="control"><div class="label">KEYBOARD CONTROLS</div><p class="keyline"><span><kbd>↑ ↓ ← →</kbd> Move</span><span class="keydot">•</span><span><kbd>↵ / Space</kbd> Select</span><span class="keydot">•</span><span><kbd>S / F</kbd> Result</span></p></div><div class="control target" id="targetbox"><div class="label" id="targettitle">CURRENT SELECTION</div><p id="targettext"></p></div></div><div id="worksheet"></div><div class="label" style="margin:15px 0 8px">RUN ACTIONS</div><div class="row"><button data-action="full">✓ Full success</button><button data-action="zero">○ No progress</button><button data-action="clear">⌫ Clear run</button><button id="undo">↶ Undo</button><small id="required"></small></div><div class="status" id="status"></div></section><section><h2>Summary of Results</h2><div class="summarygrid"><div class="summarytools row between"><label><input type="checkbox" id="header" checked> Include header</label><button id="copy">Copy Summary</button></div><div class="summarypaper"><div class="row between"><span class="label summarytitle">GENERATED SUMMARY</span><small id="summarylabel"></small></div><div class="output" id="summary"></div></div><div class="insights"><div class="row between"><span class="label blue">KEY INSIGHTS</span><small id="insightlevel"></small></div><div id="insights"></div></div></div><div class="status" id="copystatus"></div></section><section><div class="row between"><h2>Run Performance</h2><button id="toggle">Hide −</button></div><div id="analytics"><div class="row" style="margin:15px 0"><button data-metric="p" class="active">Phase progress</button><button data-metric="s">Success rate</button><button data-metric="both">Both</button><label><input type="checkbox" id="cum"> Cumulative average</label></div><div id="legend" class="row"></div><div id="graph"></div><div class="label">CONFIG COMPARISON</div><div id="comparison"></div></div></section></main><script>
'use strict';const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pick=a=>a[Math.floor(Math.random()*a.length)],pct=x=>x==null?'—':x.toFixed(1)+'%';let S={multi:false,items:1,phases:4,configs:3,runs:10,levels:[1,2],level:1,config:0,data:{},demo:false},T={r:0,i:0,k:0},history=[],metric='p',hidden=new Set(),timer;const colors=['#a6c3f4','#86cbb5','#dfb78c','#c4b2e7','#df9bac','#96cbd4'];const key=(c,r,l)=>[S.items,S.phases,l,c,r].join('/');function get(c,r,l=S.level){return S.data[key(c,r,l)]||(S.data[key(c,r,l)]={v:[],end:null,n:''})}function result(c,r,l=S.level){let a=get(c,r,l),v=Array.from({length:S.items},(_,i)=>a.v[i]??null),scored=v.every(x=>x!==null),sum=v.reduce((a,b)=>a+(b??0),0);return {...a,v,sum,scored,done:scored&&a.end!==null,p:scored?sum/(S.items*S.phases)*100:null,s:a.end===null?null:a.end*100,full:v.filter(x=>x===S.phases).length}}function stats(c,l=S.level){let a=Array.from({length:S.runs},(_,r)=>result(c,r,l)).filter(x=>x.done),n=a.length,w=a.filter(x=>x.end===1).length;return {n,w,s:n?w/n*100:null,p:n?a.reduce((s,x)=>s+x.p,0)/n:null}}function save(){history.push(JSON.stringify({S,T,task:$('task').value,robot:$('robot').value,cell:$('cell').value}));if(history.length>60)history.shift()}function sync(){for(let k of ['items','phases','configs','runs'])$(k).value=S[k];$('multi').checked=S.multi;$('items').disabled=!S.multi}function palette(k){if(k===S.phases)return '#28734f';let t=k/Math.max(1,S.phases-1)*3,a=[[224,232,241],[181,209,235],[166,215,222],[122,192,177]],j=Math.min(2,Math.floor(t)),f=t-j;return 'rgb('+a[j].map((x,i)=>Math.round(x+(a[j+1][i]-x)*f)).join(',')+')'}function nav(){ $('levels').innerHTML=[1,2,3].map(l=>`<label><input type="checkbox" data-level="${l}" ${S.levels.includes(l)?'checked':''}> L${l}　</label>`).join('');$('count').textContent=`${S.levels.length*S.configs} sheets · ${S.levels.length*S.configs*S.runs} runs`;$('tabs').innerHTML=S.levels.flatMap(l=>Array.from({length:S.configs},(_,c)=>{let on=l===S.level&&c===S.config;return `<button data-tab="${l},${c}" class="${on?'selected':''}"><span style="color:${(on?['#244e86','#65418c','#815021']:['#a8c9f5','#c8b5e9','#e8c6a0'])[l-1]}">L${l}</span>　|　<b>CONFIG ${c}</b></button>`})).join('');$('sheet').textContent=`Level ${S.level}, Config ${S.config}`;let a=stats(S.config);$('sheetstatus').textContent=`${a.n}/${S.runs} completed${S.demo?' · Demo data':''}`;$('metrics').innerHTML=[['🎯 SUCCESS RATE',pct(a.s),a.s],['📊 PHASE PROGRESS',pct(a.p),a.p],['☑ RUNS COMPLETED',`${a.n}/${S.runs}`,a.n/S.runs*100]].map(([l,v,p])=>`<div class="metric"><div class="row between"><span class="label">${l}</span><b>${v}</b></div><div class="track"><i style="width:${p||0}%"></i></div></div>`).join('')}
function run(r){let a=result(S.config,r);return `<div class="run"><div class="runline"><span class="num">${String(r+1).padStart(2,'0')}</span><div class="scores">${a.v.map((v,i)=>`<div class="group">${Array.from({length:S.phases+1},(_,k)=>`<button aria-label="Run ${r+1}, item ${i+1}, score ${k}" data-score="${r},${i},${k}" class="seg ${v===k?'chosen':''}" style="${v!==null&&k<=v?'background:'+palette(k)+';color:'+(k===S.phases?'white':'#172823'):''}">${k}</button>`).join('')}<span class="fraction">${v===null?'—':v+'/'+S.phases}</span></div>`).join('')}</div><div class="result"><button data-end="${r},1" class="${a.end===1?'yes':''}" aria-label="Success">✓</button><button data-end="${r},0" class="${a.end===0?'no':''}" aria-label="Fail">×</button></div><span class="percent">${a.p===null?'—':Math.round(a.p)+'%'}</span></div><textarea class="note" data-note="${r}" placeholder="${a.end===1?'Run completed successfully.':'Context / failure reason…'}">${esc(a.n)}</textarea></div>`}function resize(el){el.style.height='23px';el.style.height=Math.max(23,el.scrollHeight)+'px'}function worksheet(){let dual=!S.multi&&S.phases<=4&&S.runs>=4&&$('worksheet').clientWidth>=650,split=Math.ceil(S.runs/2),block=(a,b)=>'<div><div class="row between label"><span>RUN #</span><span>'+ (S.multi?'ITEM PHASES':'PHASES')+'</span><span>RESULT *　 PROGRESS %</span></div>'+Array.from({length:b-a},(_,i)=>run(a+i)).join('')+'</div>';$('worksheet').innerHTML=`<div class="runs ${dual?'dual':''}">${dual?block(0,split)+block(split,S.runs):block(0,S.runs)}</div>`;document.querySelectorAll('.note').forEach(resize);$('required').textContent=Array.from({length:S.runs},(_,r)=>result(S.config,r)).some(a=>a.scored&&a.end===null)?'End result required':'';mark()}
function mark(){document.querySelectorAll('.aim').forEach(e=>e.classList.remove('aim'));let selector=T.i<S.items?`[data-score="${T.r},${T.i},${T.k}"]`:T.i===S.items?`[data-end="${T.r},${T.k}"]`:`[data-note="${T.r}"]`;document.querySelector(selector)?.classList.add('aim');$('targettext').textContent=`Run ${String(T.r+1).padStart(2,'0')}　•　`+(T.i<S.items?`${S.multi?'Item '+(T.i+1):'Phases'}　•　Score ${T.k}/${S.phases}`:T.i===S.items?`Result　•　${T.k?'Success':'Fail'}`:'Context / Notes')}
function flash(t){clearTimeout(timer);$('targetbox').classList.add('saved');$('targettitle').textContent=t;timer=setTimeout(()=>{$('targetbox').classList.remove('saved');$('targettitle').textContent='CURRENT SELECTION'},300)}function focus(){$('workspace').focus({preventScroll:true})}function next(){if(T.r<S.runs-1)T={r:T.r+1,i:0,k:get(S.config,T.r+1).v[0]??0};mark();focus()}function advance(){if(T.i<S.items-1){T.i++;T.k=get(S.config,T.r).v[T.i]??0}else if(T.i===S.items-1){T.i++;T.k=get(S.config,T.r).end??1}else if(T.i===S.items){if(result(S.config,T.r).done&&get(S.config,T.r).end===1&&!get(S.config,T.r).n)return next();T.i++;mark();document.querySelector(`[data-note="${T.r}"]`).focus();return}else return next();mark()}function score(r,i,k){save();get(S.config,r).v[i]=k;T={r,i,k};refresh();flash('SCORE RECORDED');focus()}function end(r,k){save();get(S.config,r).end=k;T={r,i:S.items,k};refresh();flash(k?'SUCCESS RECORDED':'FAILURE RECORDED');focus();if(k&&result(S.config,r).done&&!get(S.config,r).n)next()}
function lines(all=false){let out=[];if(S.demo)out.push(['(Data generated for demonstration purposes only.)','em']);for(let l of all?S.levels:[S.level]){if(l!==(all?S.levels[0]:S.level))out.push(['']);if($('header').checked)out.push([[$('robot').value,$('task').value,$('cell').value,'Level '+l].join(', '),'strong'],['']);else if(all)out.push(['Level '+l,'strong']);for(let c of all?Array.from({length:S.configs},(_,i)=>i):[S.config]){if(all&&c)out.push(['']);let a=stats(c,l);out.push([`Config ${c}: ${a.n?pct(a.s)+' Success, '+pct(a.p)+' Progress':'No completed runs'}`,'strong']);for(let r=0;r<S.runs;r++){let x=result(c,r,l);if(!x.done)continue;let e=x.end?'Success':'Fail';if(S.multi){out.push([`Run ${r+1}: ${x.full}/${S.items} items, ${x.sum}/${S.items*S.phases} phases = ${e}, ${Math.round(x.p)}%`],['• '+x.v.map((v,i)=>`Item ${i+1}: ${v}/${S.phases}`).join(', ')]);if(x.n.trim())out.push(['• '+x.n.trim()])}else out.push([`• Run ${r+1}: ${e}, ${x.sum}/${S.phases} = ${Math.round(x.p)}%${x.n.trim()?', '+x.n.trim():''}`])}}}return out}const plain=all=>lines(all).map(x=>x[0]).join('\n'),rich=all=>lines(all).map(([t,tag])=>tag?`<${tag}>${esc(t)}</${tag}>`:esc(t)).join('\n');function output(){$('summary').innerHTML=rich(false);$('summarylabel').textContent=`LEVEL ${S.level} · CONFIG ${S.config}`;$('insightlevel').textContent='LEVEL '+S.level;let a=Array.from({length:S.configs},(_,c)=>({c,...stats(c)})).filter(x=>x.n);if(!a.length){$('insights').textContent='Complete a run to generate insights.';return}let n=a.reduce((s,x)=>s+x.n,0),w=a.reduce((s,x)=>s+x.w,0),best=k=>Math.max(...a.map(x=>x[k])),names=k=>a.filter(x=>Math.abs(x[k]-best(k))<1e-8).map(x=>'Config '+x.c).join(', '),fails=[];for(let c=0;c<S.configs;c++)for(let r=0;r<S.runs;r++){let x=result(c,r);if(x.done&&!x.end)fails.push(x.p)}let facts=[['Best success rate',names('s'),pct(best('s'))],['Best phase progress',names('p'),pct(best('p'))],['Most successful runs',names('w'),best('w')+' successful runs'],['Overall success rate',pct(w/n*100),`${w} successful · ${n-w} failed`],['Overall phase progress',pct(a.reduce((s,x)=>s+x.p*x.n,0)/n),'Weighted across completed runs'],['Run completion',`${n}/${S.configs*S.runs}`,pct(n/(S.configs*S.runs)*100)]];if(fails.length)facts.push(['Progress on failed runs',pct(fails.reduce((s,x)=>s+x,0)/fails.length),`${fails.length} failed runs`]);$('insights').innerHTML='<ul>'+facts.map(([l,v,d])=>`<li>${l}: <b>${v}</b><small>${d}</small></li>`).join('')+'</ul><small>Based on completed runs only. '+(n<S.configs*S.runs?'Results are preliminary.':'All planned runs are complete.')+'</small>'}
function chart(){let W=800,H=250,X=r=>45+735*(S.runs===1?.5:r/(S.runs-1)),Y=v=>15+195*(1-v/100),svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Run performance">`;for(let v=0;v<=100;v+=25)svg+=`<line x1="45" x2="780" y1="${Y(v)}" y2="${Y(v)}" stroke="#353c46" stroke-dasharray="3 5"/><text x="38" y="${Y(v)+4}" text-anchor="end">${v}%</text>`;for(let r=0;r<S.runs;r++)if(S.runs<=15||r%2===0)svg+=`<text x="${X(r)}" y="230" text-anchor="middle">${r+1}</text>`;for(let c=0;c<S.configs;c++){if(hidden.has(c))continue;for(let m of metric==='both'?['p','s']:[metric]){let d='',prev=false,sum=0,n=0;for(let r=0;r<S.runs;r++){let a=result(c,r);if(!a.done){prev=false;continue}let v=a[m];sum+=v;n++;if($('cum').checked)v=sum/n;d+=`${prev?'L':'M'}${X(r)},${Y(v)} `;prev=true;svg+=`<circle cx="${X(r)}" cy="${Y(v)}" r="3" fill="${colors[c]}"><title>Config ${c}, Run ${r+1}: ${pct(v)}</title></circle>`}svg+=`<path d="${d}" fill="none" stroke="${colors[c]}" stroke-width="2" ${metric==='both'&&m==='s'?'stroke-dasharray="5 4"':''}/>`}}$('graph').innerHTML=svg+'<text x="400" y="246" text-anchor="middle">Run #</text></svg>';$('legend').innerHTML=Array.from({length:S.configs},(_,c)=>`<button data-legend="${c}" style="color:${colors[c]};opacity:${hidden.has(c)?.4:1}">● Config ${c}</button>`).join('');$('comparison').innerHTML='<table><thead><tr><th>Configuration</th><th>Success rate</th><th>Phase progress</th><th>Completed</th></tr></thead><tbody>'+Array.from({length:S.configs},(_,c)=>{let a=stats(c);return `<tr><td>Config ${c}</td><td>${pct(a.s)}</td><td>${pct(a.p)}</td><td>${a.n}/${S.runs}</td></tr>`}).join('')+'</tbody></table>'}function refresh(){nav();worksheet();output();chart()}
